# Trading bot configuration (headless bot).
# Every value here can be overridden with an environment variable (see README).
# Secrets (API keys) must NOT go in this file — use env vars instead.
#
# "bp" = basis point = 1/100th of a percent. 100bp = 1%, so 0.0025 = 25bp.

feed:
  exchange: mexc       # mexc | bybit | okx | binance
  symbol: BTC_USDT     # mexc: BTC_USDT · bybit: BTCUSDT · okx: BTC-USDT-SWAP
  market: futures      # perps lead spot in price discovery, and are cheaper
  stream: trade        # trade/aggTrade = prints | bookTicker = top of book
                       # NOTE: Binance geo-blocks several regions (HTTP 451).
                       # The headless bot watches ONE symbol; the web dashboard
                       # scans many at once.

strategy:
  lookback_seconds: 1.0     # shorter window = stricter velocity filter
  allow_shorts: true        # trade downward impulses as well as up
  entry_threshold: 0.0025   # ±0.25% inside the window (25bp) to enter
  take_profit: 0.006        # +0.60% — well clear of the ~18bp round trip
  stop_loss: 0.0025         # -0.25%, cut fast
  reversal_exit: 0.0015     # bail if momentum flips 0.15%
  reversal_window: 1.0      # window (s) for the reversal check
  max_hold_seconds: 45.0    # close a stalled position after this long
  cooldown_seconds: 3.0     # wait after an exit before re-entering

risk:
  order_size_pct: 0.95       # fraction of available cash per entry
  min_notional: 10.0         # skip orders smaller than this
  daily_loss_limit_pct: 0.05 # halt after -5% on the day

broker:
  mode: paper                # "paper" (simulated) or "live" (real money — stub)
  starting_cash: 10000.0     # paper balance in quote currency (USDT)
  # MEXC futures placed through the API cost 0.08% taker (Jun 2026). The
  # 0%/0.01% shown in the MEXC app does NOT apply to API orders.
  fee_bps: 8.0
  slippage_bps: 2.0          # assumed slippage per fill
