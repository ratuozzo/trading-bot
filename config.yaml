# Trading bot configuration.
# Every value here can be overridden with an environment variable (see README).
# Secrets (API keys) must NOT go in this file — use env vars instead.

feed:
  exchange: binance    # binance | bybit | okx
  symbol: btcusdt      # binance: btcusdt · bybit: BTCUSDT · okx: BTC-USDT-SWAP
  market: futures      # "futures" = perps (lead spot in price discovery) | "spot"
  stream: aggTrade     # trade/aggTrade = prints | bookTicker = top of book
                       # (okx maps bookTicker to bbo-tbt, its tick-by-tick feed)

strategy:
  lookback_seconds: 5.0     # window used to measure the price impulse
  entry_threshold: 0.0015   # go long when price rises +0.15% over the window
  take_profit: 0.002        # close at +0.20%
  stop_loss: 0.0015         # close at -0.15%
  reversal_exit: 0.0008     # bail if momentum flips -0.08% quickly
  reversal_window: 1.5      # window (s) for the reversal check
  max_hold_seconds: 60.0    # close a stalled position after this long
  cooldown_seconds: 2.0     # wait after an exit before re-entering

risk:
  order_size_pct: 0.95       # spend 95% of available cash per entry
  min_notional: 10.0         # skip orders smaller than this
  daily_loss_limit_pct: 0.05 # halt after -5% on the day

broker:
  mode: paper                # "paper" (simulated) or "live" (real money — stub)
  starting_cash: 10000.0     # paper balance in quote currency (USDT)
  fee_bps: 5.0               # taker fee; perps ~5bps, spot ~10bps. Check yours.
  slippage_bps: 2.0          # assumed slippage per fill
