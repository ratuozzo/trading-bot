name: Test and deploy dashboard

on:
  push:
    branches:
      - main
      - claude/crypto-price-stream-trading-gdmzd6
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Check dashboard modules parse
        # Syntax-only: --check parses without executing, so no DOM is needed.
        run: |
          for f in web/js/*.js; do
            node --input-type=module --check < "$f" \
              || { echo "Syntax error in $f"; exit 1; }
            echo "ok  $f"
          done

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    # Pages only publishes from the default branch; PRs just run the tests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
